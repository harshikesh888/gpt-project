                        <span>API</span>

                        </button>
                        <button class="mode-btn" type="button" data-mode="smart" aria-pressed="false" title="Deeper reasoning for complex questions">

                            <span>Deep</span>
                        </button>
                    </div>
                    <button class="icon-btn new-chat-icon" id="newChatTop" type="button" aria-label="New chat">
                        <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>
                    </button>
                </div>
            </header>

                        </span>

                            </button>
                        </div>
                    </div>
                </form>

            </div>

                    <span><strong>Improve code</strong><small>Review and refactor</small></span>
                </button>
                <button class="suggestion" type="button" data-prompt="Draft a concise project update email to my team. We shipped the new dashboard, fixed two critical bugs, and slipped the reporting feature by one week.">
                    <span class="suggestion-icon"><svg class="icon" aria-hidden="true"><use href="#i-mail"></use></svg></span>
                    <span><strong>Write an update</strong><small>Clear, professional email</small></span>
                </button>
                <button class="suggestion" type="button" data-prompt="Plan a relaxed 3-day trip to Kyoto in spring, with a daily itinerary, food suggestions, and travel times. Keep it practical.">
                    <span class="suggestion-icon"><svg class="icon" aria-hidden="true"><use href="#i-map"></use></svg></span>
                    <span><strong>Plan something</strong><small>A 3-day Kyoto itinerary</small></span>
                </button>
            </div>
            <p class="welcome-note">Tip: press <kbd>Ctrl</kbd> <kbd>K</kbd> for a new chat.</p>
